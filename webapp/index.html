<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ploika.uz — инструменты для укладки</title>
<meta name="description" content="Плойки, фены, фен-щётки и стайлеры с доставкой по Ташкенту.">
<meta name="theme-color" content="#23151D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#23151D; --paper:#FCF8F9; --card:#FFFFFF; --blush:#F4DCE2; --blush-2:#EEC9D3;
  --rose:#C93A63; --rose-ink:#FFFFFF; --muted:#806B76; --line:#EBDDE2; --ok:#2F7D5B;
  --radius-lg:22px; --radius:14px; --radius-sm:10px;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F5E9EE; --paper:#1A1116; --card:#24181F; --blush:#3A2430; --blush-2:#4A2D3C;
    --rose:#E9668B; --rose-ink:#1A1116; --muted:#B39CA8; --line:#3A2A33; --ok:#6CC69A;
  }
}
:root[data-theme="dark"]{
  --ink:#F5E9EE; --paper:#1A1116; --card:#24181F; --blush:#3A2430; --blush-2:#4A2D3C;
  --rose:#E9668B; --rose-ink:#1A1116; --muted:#B39CA8; --line:#3A2A33; --ok:#6CC69A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:500 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{font:700 18px/1 var(--display);letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.logo span{color:var(--rose)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search svg{flex:none;color:var(--muted)}
.top-actions{display:none;gap:4px}
@media(min-width:760px){.top-actions{display:flex}}
.icon-btn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:999px}
.icon-btn:hover{background:var(--blush)}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:var(--rose-ink);font:700 11px/18px var(--body);text-align:center}
.badge[hidden]{display:none}

/* Hero */
.hero{margin:16px 0 8px;border-radius:var(--radius-lg);background:#2A1822;color:#FCF8F9;overflow:hidden;position:relative;min-height:220px;display:grid}
@media(min-width:760px){.hero{grid-template-columns:1.1fr .9fr;min-height:320px}}
.hero-text{padding:24px 22px 26px;position:relative;z-index:1;align-self:end}
.hero h1{font:700 clamp(28px,7vw,52px)/1.02 var(--display);letter-spacing:-.03em;margin:0 0 12px;max-width:12ch}
.hero p{margin:0 0 18px;color:rgba(252,248,249,.75);max-width:34ch}
.hero .btn{background:#C93A63;color:#fff}
.hero-art{position:absolute;top:0;right:0;width:46%;height:48%;pointer-events:none;opacity:.9}
@media(min-width:760px){.hero-art{position:relative;width:auto;height:auto;opacity:1}}
.hero-art svg{width:100%;height:100%}
.curl-path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s .2s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.curl-path{animation:none;stroke-dashoffset:0}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;font-weight:700;background:var(--ink);color:var(--paper);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.rose{background:var(--rose);color:var(--rose-ink)}
.btn.ghost{background:var(--blush);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Sections */
.sec{margin:28px 0 8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-head h2{font:700 20px/1.2 var(--display);letter-spacing:-.02em;margin:0}
.sec-head a{color:var(--muted);font-weight:600;text-decoration:none}
.sec-head a:hover{color:var(--rose)}

/* Categories */
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:88px;text-decoration:none}
.cat .ico{width:72px;height:72px;border-radius:50%;background:var(--blush);display:grid;place-items:center;color:var(--ink);transition:background .15s}
.cat:hover .ico,.cat[aria-current="true"] .ico{background:var(--blush-2)}
.cat[aria-current="true"] span{color:var(--rose)}
.cat span{font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.card .media{position:relative;aspect-ratio:1/1;background:var(--blush);cursor:pointer}
.media img,.media svg{width:100%;height:100%;object-fit:cover}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--card) 88%,transparent);display:grid;place-items:center;color:var(--ink)}
.fav[aria-pressed="true"]{color:var(--rose)}
.fav[aria-pressed="true"] path{fill:currentColor}
.sale-tag{position:absolute;left:8px;top:8px;background:var(--rose);color:var(--rose-ink);font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.brand{color:var(--muted);font-size:12px;font-weight:600}
.card h3{font-size:14px;font-weight:600;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.price b{font:700 16px/1.2 var(--body)}
.price s{color:var(--muted);font-size:13px}
.add{margin-top:8px;height:40px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px}
.add.in{background:var(--blush);color:var(--ink)}

/* Product page */
.pd{display:grid;gap:20px;margin-top:16px}
@media(min-width:800px){.pd{grid-template-columns:1fr 1fr;gap:36px}}
.pd .media{aspect-ratio:1/1;border-radius:var(--radius-lg);overflow:hidden;background:var(--blush);position:relative}
.pd h1{font:700 clamp(22px,4vw,30px)/1.15 var(--display);letter-spacing:-.02em;margin:4px 0 10px}
.pd .price b{font-size:24px}
.pd .desc{color:var(--muted);max-width:60ch}
.stock{font-size:13px;font-weight:600;color:var(--ok)}
.pd-actions{display:flex;gap:10px;margin:18px 0}
.pd-actions .btn{flex:1}
.facts{border-top:1px solid var(--line);margin-top:8px}
.facts div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts span{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--muted);font-weight:600}

/* Cart */
.page-title{font:700 24px/1.2 var(--display);letter-spacing:-.02em;margin:20px 0 14px}
.line{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .media{width:76px;height:76px;border-radius:var(--radius-sm);overflow:hidden;background:var(--blush)}
.line h3{font-size:14px;font-weight:600;margin:0 0 4px;line-height:1.3}
.line-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:34px}
.qty button{width:34px;height:34px;font-size:18px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-weight:700}
.remove{color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline}
.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
.summary div{display:flex;justify-content:space-between;padding:4px 0}
.summary .total{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.summary small{color:var(--muted);display:block;margin-top:6px}
.cart-layout{display:grid;gap:8px}
@media(min-width:860px){.cart-layout{grid-template-columns:1fr 360px;gap:32px;align-items:start}.cart-layout .summary{position:sticky;top:76px;margin-top:0}}

/* Form */
.form{display:grid;gap:14px;max-width:560px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:48px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--card);padding:0 14px;outline:0}
.field textarea{height:88px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose)}
.field .err{color:var(--rose);font-size:13px;margin-top:4px;display:none}
.field.bad input,.field.bad select{border-color:var(--rose)}
.field.bad .err{display:block}
.pay{display:grid;gap:8px}
.pay label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;font-weight:600;cursor:pointer}
.pay input{accent-color:var(--rose);width:18px;height:18px}

/* Empty & info */
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{font:700 20px/1.2 var(--display);color:var(--ink);margin:12px 0 6px}
.empty .btn{margin-top:16px}
.perks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:28px 0}
.perk{background:var(--blush);border-radius:var(--radius);padding:16px}
.perk b{display:block;margin-bottom:2px}
.perk span{color:var(--muted);font-size:14px}
footer{margin-top:40px;padding:28px 0 12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
footer b{color:var(--ink);display:block;margin-bottom:6px}
footer a{display:block;text-decoration:none;padding:2px 0}
footer a:hover{color:var(--rose)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;text-decoration:none;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] svg{color:var(--rose)}
.nav .badge{top:8px;right:calc(50% - 22px)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ok-ico{width:72px;height:72px;border-radius:50%;background:var(--blush);display:grid;place-items:center;margin:0 auto;color:var(--ok)}
.tg .top-actions,.tg footer{display:none}
@media(min-width:760px){html:not(.tg) .nav{display:none}html:not(.tg) body{padding-bottom:24px}.toast{bottom:24px}}
@media(max-width:759px){.hero-text{padding-top:110px}}
.tg .hero{margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/">ploika<span>.uz</span></a>
    <form class="search" role="search" id="searchForm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Найти плойку, фен…" aria-label="Поиск товаров" autocomplete="off">
    </form>
    <div class="top-actions">
      <a class="icon-btn" href="#/favorites" aria-label="Избранное"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span class="badge" data-badge="fav" hidden></span></a>
      <a class="icon-btn" href="#/cart" aria-label="Корзина"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="badge" data-badge="cart" hidden></span></a>
    </div>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<nav class="nav" aria-label="Основная навигация">
  <ul>
    <li><a href="#/" data-nav="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8Z"/></svg>Главная</a></li>
    <li><a href="#/catalog" data-nav="catalog"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Каталог</a></li>
    <li><a href="#/favorites" data-nav="favorites"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Избранное<span class="badge" data-badge="fav" hidden></span></a></li>
    <li><a href="#/cart" data-nav="cart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Корзина<span class="badge" data-badge="cart" hidden></span></a></li>
  </ul>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined && window.Telegram.WebApp.platform !== "unknown" ? window.Telegram.WebApp : null;
let DATA = null;
const $app = document.getElementById("app");

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem("gs_"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("gs_"+k, JSON.stringify(v)); } catch(e){} }
};
let cart = store.get("cart", {});      // {id: qty}
let favs = store.get("favs", []);      // [id]

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n.toLocaleString("ru-RU").replace(/,/g," ") + " " + (DATA?.store.currency || "сум");
const byId = id => DATA.products.find(p => p.id === id);
const catName = id => (DATA.categories.find(c => c.id === id) || {}).name || "";
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || "light"); } catch(e){} };
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800); }

/* ---------- illustrations (used until real photos are added) ---------- */
const ART = {
  curl:`<path d="M60 150 L130 60" stroke-width="14"/><path d="M128 63c18-22 44-4 30 18-12 19-40 10-30-10 9-18 36-14 38 6" stroke-width="5"/><rect x="40" y="140" width="34" height="56" rx="12" transform="rotate(38 57 168)" stroke-width="5"/>`,
  dryer:`<path d="M48 70h86a28 28 0 0 1 0 56H48z" stroke-width="5"/><circle cx="132" cy="98" r="14" stroke-width="5"/><path d="M80 126l-10 66h26l8-66" stroke-width="5"/><path d="M30 86h10M24 98h16M30 110h10" stroke-width="5"/>`,
  brush:`<rect x="88" y="40" width="34" height="90" rx="17" stroke-width="5"/><path d="M80 56h-8M80 72h-8M80 88h-8M80 104h-8M130 56h8M130 72h8M130 88h8M130 104h8" stroke-width="5"/><rect x="94" y="130" width="22" height="64" rx="9" stroke-width="5"/>`,
  iron:`<path d="M80 40l-10 150M120 40l10 150" stroke-width="5"/><path d="M72 40h18M110 40h18" stroke-width="5"/><rect x="66" y="40" width="28" height="70" rx="6" transform="rotate(-4 80 75)" stroke-width="5"/><rect x="106" y="40" width="28" height="70" rx="6" transform="rotate(4 120 75)" stroke-width="5"/>`,
  styler:`<rect x="90" y="110" width="26" height="84" rx="11" stroke-width="5"/><path d="M103 110V44" stroke-width="10"/><path d="M60 70q20-14 30 0t30 0 30 0" stroke-width="5"/><circle cx="103" cy="40" r="6" stroke-width="5"/>`,
  comb:`<rect x="46" y="80" width="114" height="22" rx="8" stroke-width="5"/><path d="M58 102v52M72 102v52M86 102v52M100 102v52M114 102v52M128 102v52M142 102v52" stroke-width="5"/>`
};
function art(p, big){
  if (p.image) return `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`;
  const c = DATA.categories.find(c => c.id === p.category) || {icon:"comb"};
  return `<svg viewBox="0 0 210 210" role="img" aria-label="${esc(p.name)}"><rect width="210" height="210" fill="var(--blush)"/><circle cx="160" cy="44" r="${big?70:56}" fill="var(--blush-2)"/><g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">${ART[c.icon] || ART.comb}</g></svg>`;
}
const catIcon = icon => `<svg width="40" height="40" viewBox="0 0 210 210"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ART[icon] || ART.comb}</g></svg>`;

/* ---------- cart / favorites ---------- */
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
function cartTotals(){
  let sum = 0;
  for (const [id,q] of Object.entries(cart)){ const p = byId(id); if (p) sum += p.price*q; }
  const s = DATA.store;
  const delivery = sum === 0 ? 0 : (s.free_delivery_from && sum >= s.free_delivery_from ? 0 : s.delivery_price || 0);
  return {sum, delivery, total: sum + delivery};
}
function setQty(id, q){
  const p = byId(id); if (!p) return;
  q = Math.max(0, Math.min(q, p.stock || 99));
  if (q === 0) delete cart[id]; else cart[id] = q;
  store.set("cart", cart); updateBadges();
}
function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs, id];
  store.set("favs", favs); updateBadges(); haptic();
  return favs.includes(id);
}
function updateBadges(){
  const c = cartCount(), f = favs.length;
  document.querySelectorAll('[data-badge="cart"]').forEach(b => { b.hidden = !c; b.textContent = c; });

function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c; }

/* ---------- router ---------- */
let route = {};
function parse(){
  const h = location.hash.replace(/^#/,"") || "/";
  const [path, qs] = h.split("?");
  const params = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  return {name: parts[0] || "home", arg: parts[1] ? decodeURIComponent(parts[1]) : "", params};
}
function render(){
  route = parse();
  const {name, arg, params} = route;
  let html = "";
  if (name === "home") html = viewHome();
  else if (name === "catalog") html = viewCatalog(arg, params.get("f"), params.get("q"));
  else if (name === "product") html = viewProduct(arg);
  else if (name === "favorites") html = viewFavorites();
  else if (name === "cart") html = viewCart();
  else if (name === "checkout") html = viewCheckout();
  else if (name === "delivery") html = viewDelivery();
  else if (name === "done") html = viewDone(arg, params.get("fb") === "1");
  else html = viewHome();
  $app.innerHTML = html;
  const nav = {home:"home",catalog:"catalog",product:"catalog",favorites:"favorites",cart:"cart",checkout:"cart"}[name];
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false));
  const cur = document.querySelector(`[data-nav="${nav}"]`); if (cur) cur.setAttribute("aria-current","page");
  document.getElementById("q").value = params.get("q") || "";
  window.scrollTo(0,0);
  updateTelegramChrome();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-add],[data-fav],[data-open],[data-inc],[data-dec],[data-rm],[data-back]");
  if (!t) return;
  if (t.dataset.fav){ e.stopPropagation(); const on = toggleFav(t.dataset.fav); t.setAttribute("aria-pressed", on); toast(on ? "Добавлено в избранное" : "Убрано из избранного"); if (route.name==="favorites") render(); return; }
  if (t.dataset.add){ const id = t.dataset.add; if (cart[id] && route.name !== "product"){ location.hash = "#/cart"; return; } setQty(id, (cart[id]||0)+1); haptic("medium"); toast("Добавлено в корзину"); render(); return; }
  if (t.dataset.open){ location.hash = "#/product/"+t.dataset.open; return; }
  if (t.dataset.inc){ setQty(t.dataset.inc, (cart[t.dataset.inc]||0)+1); haptic(); render(); return; }
  if (t.dataset.dec){ setQty(t.dataset.dec, (cart[t.dataset.dec]||0)-1); haptic(); render(); return; }
  if (t.dataset.rm){ setQty(t.dataset.rm, 0); render(); return; }
  if (t.dataset.back !== undefined){ history.length > 1 ? history.back() : (location.hash = "#/"); }
});
document.addEventListener("change", e => { if (e.target.id === "sort"){ store.set("sort", e.target.value); render(); } });
document.addEventListener("submit", e => {
  if (e.target.id === "searchForm"){ e.preventDefault(); const q = document.getElementById("q").value.trim(); location.hash = q ? "#/catalog?q="+encodeURIComponent(q) : "#/catalog"; document.getElementById("q").blur(); }
  if (e.target.id === "checkout"){ e.preventDefault(); submitOrder(); }
});
window.addEventListener("hashchange", render);

/* ---------- order ---------- */
function readForm(){
  const f = document.getElementById("checkout"); if (!f) return null;
  const v = Object.fromEntries(new FormData(f).entries());
  let ok = true;
  const check = (name, valid) => { const fld = f.querySelector(`[name="${name}"]`).closest(".field"); fld.classList.toggle("bad", !valid); if (!valid && ok){ ok = false; f.querySelector(`[name="${name}"]`).focus(); } };
  check("name", v.name.trim().length >= 2);
  check("phone", v.phone.replace(/\D/g,"").length >= 12);
  check("area", !!v.area);
  check("address", v.address.trim().length >= 5);
  if (!ok){ haptic("rigid"); return null; }
  store.set("customer", {name:v.name.trim(), phone:v.phone.trim(), area:v.area, address:v.address.trim(), pay:v.pay});
  return v;
}
function orderText(order){
  const lines = order.items.map(([id,q]) => { const p = byId(id); return `• ${p.name} × ${q} — ${money(p.price*q)}`; });
  const t = cartTotals();
  return [`Заказ ${order.id}`, ...lines, `Доставка: ${t.delivery ? money(t.delivery) : "бесплатно"}`, `Итого: ${money(t.total)}`, "", `Имя: ${order.c.name}`, `Телефон: ${order.c.phone}`, `Адрес: ${order.c.area}, ${order.c.address}`, `Оплата: ${order.c.pay}`, order.c.note ? `Комментарий: ${order.c.note}` : ""].filter(Boolean).join("\n");
}
async function submitOrder(){
  const v = readForm(); if (!v) return;
  const order = {
    v:1,
    id: "GS" + Date.now().toString(36).toUpperCase().slice(-6),
    items: Object.entries(cart),
    c: {name:v.name.trim(), phone:v.phone.trim(), area:v.area, address:v.address.trim(), pay:v.pay, note:(v.note||"").trim().slice(0,300)}
  };
  // Inside Telegram (opened from the bot's keyboard button): the bot receives the order directly.
  if (tg && !tg.initDataUnsafe.query_id){
    try {
      tg.sendData(JSON.stringify(order));
      cart = {}; store.set("cart", cart);
      return; // Telegram closes the Mini App; the bot confirms in chat
    } catch(err){ /* falls through to the copy-and-send route */ }
  }
  // Outside Telegram (or opened from the menu button): copy the order and open the bot chat.
  const text = orderText(order);
  try { await navigator.clipboard.writeText(text); } catch(e){}
  cart = {}; store.set("cart", cart); updateBadges();
  location.hash = "#/done/" + order.id + "?fb=1";
  if (tg) { try { tg.openTelegramLink("https://t.me/" + DATA.store.telegram_bot); } catch(e){} }
}

/* ---------- Telegram chrome ---------- */
let mainHandler = null;
function updateMainButton(){
  if (!tg || !DATA) return;
  const mb = tg.MainButton;
  if (mainHandler){ mb.offClick(mainHandler); mainHandler = null; }
  const name = route.name;
  if (name === "cart" && cartCount()){
    mb.setParams({text:`Оформить · ${money(cartTotals().total)}`, is_visible:true});
    mainHandler = () => { location.hash = "#/checkout"; };
  } else if (name === "checkout"){
    mb.setParams({text:"Отправить заказ", is_visible:true});
    mainHandler = () => submitOrder();
  } else if (cartCount() && name !== "done"){
    mb.setParams({text:`Корзина · ${money(cartTotals().total)}`, is_visible:true});
    mainHandler = () => { location.hash = "#/cart"; };
  } else { mb.hide(); }
  if (mainHandler) mb.onClick(mainHandler);
}
function updateTelegramChrome(){
  if (!tg) return;
  route.name === "home" ? tg.BackButton.hide() : tg.BackButton.show();
  updateMainButton();
}

/* ---------- boot ---------- */
async function boot(){
  if (tg){
    document.documentElement.classList.add("tg");
    document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
    tg.ready(); tg.expand();
    tg.BackButton.onClick(() => history.length > 1 ? history.back() : (location.hash = "#/"));
    tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light"; });
    try { tg.setHeaderColor(tg.colorScheme === "dark" ? "#1A1116" : "#FCF8F9"); } catch(e){}
  }
  try {
    const r = await fetch("products.json", {cache:"no-cache"});
    DATA = await r.json();
  } catch(e){
    $app.innerHTML = `<div class="empty"><h2>Каталог не загрузился</h2><p>Проверьте интернет и обновите страницу. Если открываете файл с компьютера, запустите сайт через сервер (см. README).</p></div>`;
    return;
  }
  // drop items from the cart that no longer exist
  for (const id of Object.keys(cart)) if (!byId(id)) delete cart[id];
  document.title = `${DATA.store.name} — инструменты для укладки`;
  updateBadges(); render();
}
boot();
})();
</script>
</body>
</html>
