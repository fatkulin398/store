<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Админ-панель — ploika.uz</title>
<meta name="theme-color" content="#23151D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#23151D; --paper:#F7F2F4; --card:#FFFFFF; --soft:#FBF6F8; --blush:#F4DCE2; --blush-2:#EEC9D3;
  --rose:#C93A63; --rose-ink:#FFFFFF; --muted:#7A6571; --line:#ECDFE4; --ok:#2F7D5B; --warn:#B26A00; --bad:#C0392B;
  --s-new:#C93A63; --s-confirmed:#3B6FB6; --s-delivering:#B26A00; --s-done:#2F7D5B; --s-cancelled:#8C7C84;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --side:232px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#F5E9EE; --paper:#140D11; --card:#1F151B; --soft:#24181F; --blush:#3A2430; --blush-2:#4A2D3C;
    --rose:#E9668B; --rose-ink:#140D11; --muted:#B39CA8; --line:#33242C; --ok:#6CC69A; --warn:#E3A44A; --bad:#EF7A6B;
    --s-new:#E9668B; --s-confirmed:#7FA6E8; --s-delivering:#E3A44A; --s-done:#6CC69A; --s-cancelled:#9C8A93;
  }
}
@media (prefers-color-scheme: dark){ :root .kpi.accent .delta{color:#5E4A55} :root .kpi.accent .label{color:#5E4A55} :root .kpi.accent .delta.up{color:#1F7A4D} :root .kpi.accent .delta.down{color:#B23A2B} }
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:500 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;min-height:100vh}
@media(min-width:900px){.shell{grid-template-columns:var(--side) 1fr}}
.side{display:none}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--card);border-right:1px solid var(--line)}
}
.brand{font:700 17px/1 var(--display);letter-spacing:-.02em;padding:6px 10px 18px}
.brand span{color:var(--rose)}
.brand small{font:600 11px var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--muted)}
.side a:hover{background:var(--soft);color:var(--ink)}
.side a[aria-current="page"]{background:var(--blush);color:var(--ink)}
.side a[aria-current="page"] svg{color:var(--rose)}
.side .count{margin-left:auto;background:var(--rose);color:var(--rose-ink);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.side .foot{margin-top:auto;display:grid;gap:4px}
.main{min-width:0;padding:0 16px 96px}
@media(min-width:900px){.main{padding:0 32px 48px}}
.top{display:flex;align-items:center;gap:12px;height:64px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px)}
.top h1{font:700 20px/1.2 var(--display);letter-spacing:-.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:900px){.tabs{display:none}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none;position:relative}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--rose)}
.tabs .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rose);color:var(--rose-ink);border-radius:999px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:700;background:var(--ink);color:var(--paper);white-space:nowrap;text-decoration:none}
.btn.rose{background:var(--rose);color:var(--rose-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--card);color:var(--ink)}
.input,select.input,textarea.input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:0}
textarea.input{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--rose)}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;flex:1;min-width:160px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search svg{color:var(--muted);flex:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
@media(min-width:900px){.chips{margin:0 0 12px;padding:0;flex-wrap:wrap}}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip b{font-weight:800;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}

/* Cards & KPIs */
.grid{display:grid;gap:12px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font:800 15px/1.3 var(--body);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 a,.panel h2 span{font-size:13px;font-weight:700;color:var(--muted);text-decoration:none}
.kpi .label{color:var(--muted);font-weight:600;font-size:13px}
.kpi .val{font:800 clamp(18px,3.4vw,26px)/1.2 var(--body);margin:4px 0 2px;letter-spacing:-.01em}
.kpi.accent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kpi.accent .label,.kpi.accent .delta{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.delta{font-size:12.5px;font-weight:700;color:var(--muted)}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.kpi.accent .delta.up{color:#8EE0B4} .kpi.accent .delta.down{color:#FFB3A7}
.cols{display:grid;gap:12px;margin-top:12px}
@media(min-width:1100px){.cols.two{grid-template-columns:1.6fr 1fr}.cols.half{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:600 10.5px var(--body)}
.chart .gridline{stroke:var(--line)}
.chart .barv{fill:var(--rose)}
.chart .barv:hover{fill:var(--ink)}
.chart .linev{fill:none;stroke:var(--ink);stroke-width:2}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .v{font-weight:700}
.hbar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft)}
.hbar .fill{height:100%;border-radius:4px;background:var(--rose)}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:90px}
.hours div{background:var(--rose);border-radius:3px 3px 0 0;min-height:2px}
.hours-l{display:grid;grid-template-columns:repeat(24,1fr);font-size:10px;color:var(--muted);margin-top:4px;text-align:center}

/* Lists */
.list{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .main-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:800}
.row .amt small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--blush);display:grid;place-items:center;font-weight:800;color:var(--ink);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px 2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--blush);margin-right:4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
table.t .r{text-align:right}
.only-wide{display:none}
@media(min-width:900px){.only-wide{display:block}.only-narrow{display:none}}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,10,15,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;background:var(--paper);right:0;bottom:0;left:0;max-height:92vh;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
@media(min-width:900px){.drawer{top:0;left:auto;width:520px;max-height:none;border-radius:0;transform:translateX(100%)}}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h h3{margin:0;font:700 17px/1.2 var(--display);flex:1;letter-spacing:-.01em}
.drawer-b{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;flex:1}
.drawer-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.drawer-f .btn{flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.items .it{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.items .tot{display:flex;justify-content:space-between;padding-top:10px;font-weight:800;font-size:16px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field .hint{color:var(--muted);font-size:12px;margin-top:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;font-weight:600}
.checks input{width:18px;height:18px;accent-color:var(--rose)}
.photo{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.photo .pv{width:96px;height:96px;border-radius:12px;background:var(--blush);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.photo .pv img{width:100%;height:100%;object-fit:cover}

/* Save bar, toast, login */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(560px,calc(100% - 24px))}
@media(min-width:900px){.savebar{bottom:24px;left:calc(50% + var(--side)/2)}}
.savebar span{flex:1;font-weight:600}
.savebar .btn.ghost{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 30%,transparent)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);display:grid;gap:14px}
.login h1{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 4px}
.login p{color:var(--muted);margin:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.subtabs button{padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--rose)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:13px}
.note b{color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
/* ================= config & state ================= */
const LS = {
  get(k, d){ try { const v = localStorage.getItem("pa_"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("pa_"+k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem("pa_"+k); } catch(e){} }
};
const S = {
  api: LS.get("api", ""),
  token: LS.get("token", ""),
  storeName: "ploika.uz",
  route: "home",
  // catalog editing
  cat: null, sha: null, editable: false, dirty: false, catTab: "products", previews: {},
  // filters
  sales: {status:"", days:"30", q:""}, clientsQ: "", catQ: "", catCat: "", anDays: 30,
  pending: 0,
};
const $root = document.getElementById("root");

/* ================= helpers ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n || 0).toLocaleString("ru-RU");
const money = n => fmt(n) + " сум";
const short = n => n >= 1e9 ? (n/1e9).toFixed(1).replace(".0","")+" млрд" : n >= 1e6 ? (n/1e6).toFixed(1).replace(".0","")+" млн" : n >= 1e3 ? Math.round(n/1e3)+" тыс" : String(n);
const TZ = "Asia/Tashkent";
const dt = ts => new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(ts*1000);
const dshort = s => new Intl.DateTimeFormat("ru-RU",{timeZone:"UTC",day:"numeric",month:"short"}).format(new Date(s+"T00:00:00Z"));
const ago = ts => { const m = Math.round((Date.now()/1000 - ts)/60); if (m < 1) return "только что"; if (m < 60) return m+" мин назад"; const h = Math.round(m/60); if (h < 24) return h+" ч назад"; return dt(ts); };
const phoneFmt = p => { const d = String(p||"").replace(/\D/g,""); return d.length === 12 ? `+${d.slice(0,3)} ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}` : "+"+d; };
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c; };
const STATUS = {
  new:{t:"Новый",c:"var(--s-new)"}, confirmed:{t:"Подтверждён",c:"var(--s-confirmed)"},
  delivering:{t:"Доставляется",c:"var(--s-delivering)"}, done:{t:"Выполнен",c:"var(--s-done)"}, cancelled:{t:"Отменён",c:"var(--s-cancelled)"}
};
const NEXT = {new:["confirmed","Подтвердить"], confirmed:["delivering","Передан курьеру"], delivering:["done","Выполнен"]};
const badge = s => `<span class="badge" style="--c:${STATUS[s]?.c||"var(--muted)"}">${STATUS[s]?.t||s}</span>`;
const delta = (v, label) => v === null || v === undefined ? `<span class="delta">${label ? "нет данных за "+label : ""}</span>` : `<span class="delta ${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v}%${label?" к "+label:""}</span>`;
function toast(msg, err){ const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast show" + (err?" err":""); clearTimeout(toast._t); toast._t = setTimeout(()=>t.className="toast"+(err?" err":""), err?4000:2200); }

const ICON = {
  home:'<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8Z"/>',
  sales:'<path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  catalog:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  clients:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20a6 6 0 0 0-4-5.6"/>',
  analytics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
  out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  shop:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const ic = (n, s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const NAV = [["home","Главное"],["sales","Продажи"],["catalog","Каталог"],["clients","Клиенты"],["analytics","Аналитика"]];

/* ================= API ================= */
async function api(path, opts = {}){
  const headers = Object.assign({}, opts.body && !(opts.body instanceof FormData) ? {"Content-Type":"application/json"} : {}, S.token ? {Authorization:"Bearer "+S.token} : {});
  let r;
  try { r = await fetch(S.api.replace(/\/$/,"") + path, Object.assign({}, opts, {headers, body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body})); }
  catch(e){ throw new Error("Сервер не отвечает. Проверьте, что бот запущен на Railway."); }
  let data = {}; try { data = await r.json(); } catch(e){}
  if (r.status === 401 && S.token){ logout(true); throw new Error("Сессия закончилась — войдите заново"); }
  if (!r.ok) { const e = new Error(data.error || "Ошибка " + r.status); e.status = r.status; throw e; }
  return data;
}

/* ================= charts ================= */
function barChart(series, key, {fmtV = short, height = 220} = {}){
  if (!series.length) return "";
  const W = window.innerWidth < 700 ? 360 : 640, H = height, pl = 44, pb = 26, pt = 10, pr = 6;
  const max = Math.max(1, ...series.map(d => d[key]));
  const step = (W - pl - pr) / series.length, bw = Math.max(2, Math.min(28, step * .64));
  const nice = niceMax(max), m = nice / Math.pow(10, Math.floor(Math.log10(nice))), ticks = m === 2 ? 4 : 5, y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = "";
  for (let i = 0; i <= ticks; i++){ const v = nice * i / ticks; g += `<line class="gridline" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end">${fmtV(v)}</text>`; }
  const every = Math.ceil(series.length / (W < 500 ? 5 : 8));
  series.forEach((d, i) => {
    const x = pl + i * step + (step - bw) / 2, h = Math.max(d[key] ? 2 : 0, (H - pt - pb) * d[key] / nice);
    g += `<rect class="barv" x="${x}" y="${H - pb - h}" width="${bw}" height="${h}" rx="3"><title>${dshort(d.date)}: ${key==="revenue"?money(d[key]):d[key]+" "+plural(d[key],"заказ","заказа","заказов")}</title></rect>`;
    if (i % every === 0 || series.length <= 8) g += `<text x="${x + bw/2}" y="${H - 8}" text-anchor="middle">${dshort(d.date)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="График">${g}</svg>`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function hbars(rows, {fmtV = money, empty = "Пока нет данных"} = {}){
  if (!rows.length) return `<div class="empty">${empty}</div>`;
  const max = Math.max(...rows.map(r => r.value), 1);
  return `<div class="hbars">${rows.map(r => `<div class="hbar"><span class="t">${esc(r.label)}</span><span class="v num">${fmtV(r.value)}</span><div class="track"><div class="fill" style="width:${(r.value/max*100).toFixed(1)}%"></div></div></div>`).join("")}</div>`;
}

function applyProduct(){

async function uploadPhoto(file){
  if (!file) return;
  const pv = document.getElementById("pv"); pv.textContent = "Загружаем…";
  try {
    const blob = await resizeImage(file, 1000, .84);
    const fd = new FormData(); fd.append("file", blob, (file.name||"photo").replace(/\.[^.]+$/,"") + ".jpg");
    const r = await api("/api/images", {method:"POST", body: fd});
    const url = URL.createObjectURL(blob); S.previews[r.path] = url;
    document.querySelector('#pForm [name="image"]').value = r.path;
    pv.innerHTML = `<img src="${url}" alt="">`;
    toast("Фото загружено");
  } catch(e){ pv.textContent = "Ошибка"; toast(e.message, true); }
}
function resizeImage(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("Не удалось обработать фото")), "image/jpeg", q);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error("Этот файл не похож на фото"));
    img.src = URL.createObjectURL(file);
  });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-order],[data-product],[data-client],[data-status],[data-days],[data-cattab],[data-setst],[data-delcat],[data-filter-new]");
  if (!t) { if (e.target.id === "scrim") closeDrawer(); return; }
  const a = t.dataset.act;
  if (t.dataset.filterNew !== undefined){ S.sales.status = "new"; S.sales.days = ""; return; }
  if (a){ e.preventDefault();
    if (a === "logout") logout();
    else if (a === "refresh") { if (S.route==="catalog" && S.dirty && !confirm("Сбросить несохранённые изменения?")) return; if (S.route==="catalog") S.cat = null; route(); }
    else if (a === "close") closeDrawer();
    else if (a === "new-product") openProduct(null);
    else if (a === "apply-product") applyProduct();
    else if (a === "del-product") { const p = S.cat.products.find(x=>x.id===t.dataset.id); if (confirm(`Удалить «${p.name}»? Это применится после сохранения.`)) { S.cat.products = S.cat.products.filter(x=>x.id!==p.id); markDirty(); closeDrawer(); viewCatalog(); } }
    else if (a === "rm-photo") { document.querySelector('#pForm [name="image"]').value = ""; document.getElementById("pv").textContent = "Нет фото"; t.remove(); }
    else if (a === "save-catalog") saveCatalog();
    else if (a === "discard") { if (confirm("Отменить все несохранённые изменения?")) { S.cat = null; S.dirty = false; viewCatalog(true); } }
    else if (a === "new-cat") { const name = prompt("Название новой категории"); if (name && name.trim()) { const id = translit(name) || "cat" + Date.now().toString(36); if (S.cat.categories.some(c=>c.id===id)) { toast("Такая категория уже есть", true); return; } S.cat.categories.push({id, name:name.trim(), icon:"comb"}); markDirty(); viewCatalog(); } }
    return;
  }
  if (t.dataset.order) return openOrder(t.dataset.order);
  if (t.dataset.product) return openProduct(t.dataset.product);
  if (t.dataset.client) return openClient(t.dataset.client);
  if (t.dataset.status !== undefined) { S.sales.status = t.dataset.status; return viewSales(); }
  if (t.dataset.days) { S.anDays = +t.dataset.days; return viewAnalytics(); }
  if (t.dataset.cattab) { S.catTab = t.dataset.cattab; return viewCatalog(); }
  if (t.dataset.setst) return setStatus(+t.dataset.id, t.dataset.setst);
  if (t.dataset.delcat !== undefined) { const i = +t.dataset.delcat; S.cat.categories.splice(i,1); markDirty(); viewCatalog(); }
});

function translit(s){
  const m = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya",ў:"o",қ:"q",ғ:"g",ҳ:"h"};
  return s.toLowerCase().split("").map(c => m[c] ?? c).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30);
}

  S.route = NAV.some(([id]) => id === r) ? r : "home";
  closeDrawer();
  ({home:viewHome, sales:viewSales, catalog:()=>viewCatalog(), clients:viewClients, analytics:viewAnalytics})[S.route]();
}
window.addEventListener("hashchange", () => {
  route();
});

/* boot: подхватываем адрес сервера и название из products.json */
(async () => {
  try {
    const r = await fetch("products.json", {cache:"no-cache"}); const d = await r.json();
    S.storeName = d.store.name || S.storeName;
    if (!S.api && d.store.api_url) S.api = d.store.api_url;
  } catch(e){}
  document.title = "Админ-панель — " + S.storeName;
  route();
})();
})();
</script>
